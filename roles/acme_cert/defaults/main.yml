---
# acme_cert：只负责签发证书（ACME：HTTP-01 或 DNS-01 + acme-dns），与具体项目无关。
# 调用方需提供：tls_domain（base domain，不带 *）和 tls_wildcard（是否申请泛域名）。
# 文件全部写 tls_work_dir（调用方无需关心）：
#   {{ tls_work_dir }}/account.key（ACME 账号，跨证书共享）
#   {{ tls_domain_dir }}/{{ tls_file_prefix }}{csr,privkey,cert,fullchain}.pem
#   {{ tls_acme_dns_state_file }}（acme-dns client，apex/wildcard 共享）

# staging=true 走 Let's Encrypt 演练环境（签发不受信证书，仅供演练）
tls_acme_staging: false
tls_acme_directory: >-
  {{ 'https://acme-staging-v02.api.letsencrypt.org/directory' if tls_acme_staging
     else 'https://acme-v02.api.letsencrypt.org/directory' }}

# 产物目录（证书链、私钥与 ACME 中间产物）
# 实际使用 tls_work_dir：staging 时自动加 -staging 后缀，避免演练产物覆盖正式证书；
# 需要完全自定义时直接覆盖 tls_work_dir（如 -e tls_work_dir=/tmp/acme-debug，此时不再加后缀）。
tls_work_dir_base: "/root/ansible/keys/acme"
tls_work_dir: "{{ tls_work_dir_base }}{{ '-staging' if tls_acme_staging else '' }}"
# tls_domain 必须是不带 *. 的 base domain；泛域名用 tls_wildcard 声明
tls_wildcard: false
# http-01 不支持泛域名，此时忽略 tls_wildcard
tls_wildcard_effective: "{{ (tls_wildcard | bool) and tls_challenge == 'dns-01' }}"
# 每个 base domain 一个目录；泛域名文件加前缀，和普通证书共存
tls_domain_dir: "{{ tls_work_dir }}/{{ tls_domain }}"
tls_file_prefix: "{{ 'wildcard-' if tls_wildcard_effective else '' }}"
tls_csr_path: "{{ tls_domain_dir }}/{{ tls_file_prefix }}csr.pem"
tls_key_path: "{{ tls_domain_dir }}/{{ tls_file_prefix }}privkey.pem"
tls_cert_path: "{{ tls_domain_dir }}/{{ tls_file_prefix }}cert.pem"
tls_fullchain_path: "{{ tls_domain_dir }}/{{ tls_file_prefix }}fullchain.pem"
# CSR CN 用 base domain；SAN 由 tls_wildcard 决定
tls_san: ["DNS:{{ '*.' if tls_wildcard_effective else '' }}{{ tls_domain }}"]
# 证书剩余有效期低于该天数才续期；force_renew 强制重签（域名变更 / 演练）
tls_remaining_days: 30
tls_force_renew: false
tls_key_size: 2048
# HTTP-01 临时校验服务
tls_webroot: /tmp/acme_webroot

# ---------------------------------------------------------------------------
# 校验方式
# ---------------------------------------------------------------------------
# http-01：保持原有行为（目标节点需要开放 80 端口）
# dns-01 ：通过 acme-dns 完成 DNS-01（节点无需开放端口，支持泛域名）
tls_challenge: http-01

# ---------------------------------------------------------------------------
# acme-dns（仅在 tls_challenge=dns-01 时使用）
# ---------------------------------------------------------------------------
# 首次运行 POST /register，结果写入 tls_acme_dns_state_file，后续运行直接复用。
# 重新注册：删除对应的 state 文件后重跑。
# 如果已经在别处注册过，可直接通过 tls_acme_dns_clients 提供（优先于状态文件）。
tls_acme_dns_register_url: "https://auth.acme-dns.io/register"
tls_acme_dns_update_url: "https://auth.acme-dns.io/update"
# acme-dns client 按 base domain 共享，apex/wildcard 使用同一份 client/CNAME。
# client state 放在独立的 acme-dns 目录，权限 0600，不要提交到版本库。
tls_acme_dns_state_file: "{{ tls_work_dir }}/acme-dns/{{ tls_domain }}/acme-dns.json"
# 自建 acme-dns 使用自签证书时，需要显式设为 false（或自行提供可信 CA）
tls_acme_dns_validate_certs: true
# 注册时限制允许调用 /update 的来源（CIDR 列表）；留空表示不限制
tls_acme_dns_allowfrom: []

# 已注册的 client；key 为去掉 *. 的域名。若提供，则跳过 /register。
# tls_acme_dns_clients:
#   example.com:
#     username: "..."
#     password: "..."
#     subdomain: "..."
#     fulldomain: "..."
#     update_url: "..."   # 可选，默认 tls_acme_dns_update_url
tls_acme_dns_clients: {}

# 控制端用于校验 TXT 的 DNS resolver 和重试参数
# 需要控制端安装 dig（dnsutils / bind-utils）
# Cloudflare 等 DNS 服务商需要把 CNAME 设为 DNS only，不能开启代理。
tls_acme_dns_resolver: "1.1.1.1"
tls_acme_dns_propagation_retries: 24
tls_acme_dns_propagation_delay: 5
