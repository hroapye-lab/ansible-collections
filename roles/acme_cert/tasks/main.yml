---
# 只做签发：控制端生成账号钥/域名钥/CSR → 下单 → HTTP-01（challenge.yml，各节点响应）
# 或 DNS-01（challenge_dns.yml，控制端通过 acme-dns 写 TXT）→ 取回 fullchain.pem。
# 证书剩余有效期大于 tls_remaining_days 时第一阶段不返回
# challenge_data，整体跳过（幂等，可随时重跑）。
# 产物全部写 tls_work_dir（defaults），路径由“导出证书路径”提供给调用方。

- name: 创建中间产物目录
  ansible.builtin.file:
    path: "{{ tls_work_dir }}"
    state: directory
    mode: "0700"
  run_once: true
  delegate_to: localhost

- name: 创建域名工作目录
  ansible.builtin.file:
    path: "{{ tls_domain_dir }}"
    state: directory
    mode: "0700"
  run_once: true
  delegate_to: localhost

- name: 生成 ACME 账号钥
  community.crypto.openssl_privatekey:
    path: "{{ tls_work_dir }}/account.key"
    type: RSA
    size: "{{ tls_key_size }}"
    mode: "0600"
  run_once: true
  delegate_to: localhost

- name: 生成域名私钥
  community.crypto.openssl_privatekey:
    path: "{{ tls_key_path }}"
    type: RSA
    size: "{{ tls_key_size }}"
    mode: "0640"
  run_once: true
  delegate_to: localhost

- name: 生成 CSR（CN 为 tls_domain，SAN 按 tls_wildcard）
  community.crypto.openssl_csr:
    path: "{{ tls_csr_path }}"
    privatekey_path: "{{ tls_key_path }}"
    common_name: "{{ tls_domain }}"
    subject_alt_name: "{{ tls_san }}"
    force: "{{ tls_force_renew }}"
    mode: "0600"
  run_once: true
  delegate_to: localhost

# 注意：不要给这个任务加 contact。Let's Encrypt 自 2025-06 起不再存储账号邮箱，
# 创建/更新账号时接口也不再返回 contact（请求里的值被忽略，仍返回 200）；
# 而模块在 state=present 下会拿 contact 与 CA 回显值比较，传入非空 contact
# 会让本任务每次都判定为 changed。
# 参考：https://community.letsencrypt.org/t/support-ended-for-expiration-notification-emails/238173
- name: 确保 ACME 账号存在
  community.crypto.acme_account:
    acme_directory: "{{ tls_acme_directory }}"
    acme_version: 2
    account_key_src: "{{ tls_work_dir }}/account.key"
    state: present
    terms_agreed: true
  run_once: true
  delegate_to: localhost

# DNS-01 需要先准备好 acme-dns 注册信息和 _acme-challenge 的 CNAME；
# 注册结果会写到 tls_acme_dns_state_file，后续运行直接复用。
- name: 准备 acme-dns 注册与 CNAME
  ansible.builtin.include_tasks:
    file: acme_dns_bootstrap.yml
    apply:
      run_once: true
      delegate_to: localhost
  when: tls_challenge == 'dns-01'
  run_once: true

- name: 发起 ACME 订单（无需续期时不返回 challenge_data）
  community.crypto.acme_certificate:
    acme_directory: "{{ tls_acme_directory }}"
    acme_version: 2
    account_key_src: "{{ tls_work_dir }}/account.key"
    modify_account: false
    challenge: "{{ tls_challenge }}"
    csr: "{{ tls_csr_path }}"
    dest: "{{ tls_cert_path }}"
    fullchain_dest: "{{ tls_fullchain_path }}"
    remaining_days: "{{ tls_remaining_days }}"
    force: "{{ tls_force_renew }}"
  register: tls_order
  run_once: true
  delegate_to: localhost

- name: HTTP-01 校验与证书签发
  ansible.builtin.include_tasks: challenge.yml
  # 只看 is changed：无需续期时模块早退 changed=False；下单时恒为 True。
  # 不能用 challenge_data 是否为空判断——CA 复用已 valid 的授权时不返回它，
  # 但订单仍需第二步 finalize 才能取证（失败重试正是这种场景）。
  when:
    - tls_order is changed
    - tls_challenge == 'http-01'

- name: DNS-01（acme-dns）校验与证书签发
  ansible.builtin.include_tasks:
    file: challenge_dns.yml
    apply:
      run_once: true
      delegate_to: localhost
  when:
    - tls_order is changed
    - tls_challenge == 'dns-01'
  run_once: true

- name: 统一最终产物权限
  ansible.builtin.file:
    path: "{{ item }}"
    mode: "0640"
  loop:
    - "{{ tls_fullchain_path }}"
    - "{{ tls_key_path }}"
  run_once: true
  delegate_to: localhost

- name: 导出证书路径
  ansible.builtin.set_fact:
    acme_tls_cert: "{{ tls_fullchain_path }}"
    acme_tls_key: "{{ tls_key_path }}"
