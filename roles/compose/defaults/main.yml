---
# ==== 路径 ====
# 项目名（可选）：缺省从 compose_dir 基名推导（compose 以目录基名作为项目名）
compose_name: ""

# 目标主机上的 compose 项目目录：默认 /opt/compose，建议显式传整路径，
# 项目名自动取其基名，例如：
#   compose_dir: /opt/compose/kamailio   # 项目名 → kamailio
compose_dir: /opt/compose

# 控制机上 compose 项目【源目录】（一个 role 调用对应一个 compose）：
# 纯粹的主输入，必填，建议绝对路径。不做任何默认拼接。
compose_src: ""

# 模板目标的基础路径前缀（可选），拼接到 dst 前面：
#   compose_templates_base: config/kamailio
#   compose_templates:
#     - src: /path/to/app.cfg.j2
#       dst: app.cfg          # 实际落盘 → {{ compose_dir }}/config/kamailio/app.cfg
# 留空时 dst 直接相对于 compose_dir（向后兼容）
compose_templates_base: ""

# 需要按环境渲染的模板清单，逐项 {src, dst}：
#   - src：控制机上的模板路径，写什么用什么（建议绝对路径）；
#   - dst：渲染结果落到项目目录内的相对路径（若设了 compose_templates_base，
#          dst 不含 base 前缀，由角色自动拼接）。
# 命中 (base/dst) 的源文件在推送时自动跳过。示例：
#   compose_templates_base: config/kamailio
#   compose_templates:
#     - src: /path/to/app.cfg.j2
#       dst: app.cfg
compose_templates: []

# 推送/渲染时排除的目录或文件名（任意层级下匹配即排除），支持 * ? 通配符，
# 例如 .git、__pycache__，或 '*.md' 排除所有 Markdown 文档
compose_exclude:
  - .git
  - __pycache__

# 调用角色时传入的渲染变量（字典），模板中用 {{ compose_vars.xxx }} 引用，
# 例如：
#   - role: docker-compose
#     vars:
#       compose_name: nginx
#       compose_vars:
#         domain: example.com
#         port: 8080
compose_vars: {}

# ==== 行为 ====
# up 之前是否先 docker compose pull
compose_pull: true
# 是否校验渲染后的 compose 配置（docker compose config -q）
compose_validate: true
# 推送/渲染的文件有变化时是否自动 docker compose restart
# （up -d 已能处理 compose 定义/镜像/变量替换的变化；此开关补上
#   bind mount 配置文件变化不会自动生效的缺口）
compose_restart_on_changed: true
# docker compose up -d 附加参数
compose_up_args: "--remove-orphans"
# docker compose down 附加参数
compose_down_args: ""
# 追加到 docker compose 的全局参数（如 "-f extra.yml"、"--profile xxx"）
compose_cli: ""

# ==== 状态 ====
# present（默认，启动/更新）| absent（停止并移除）
compose_state: present
# state=absent 时是否删除项目目录
compose_cleanup_dir: false

# ==== 属主/权限 ====
# 建立目录与复制/渲染时【不处理属主】（由目标主机默认决定），仅设置 mode
compose_dir_mode: "0755"
compose_file_mode: "0644"
