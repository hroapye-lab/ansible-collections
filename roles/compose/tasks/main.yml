---
# 部署单个 Docker Compose 项目（目录形式）。
#
# 控制机上的 compose 源目录（compose_src）已定义好 compose 内容，推送到目标
# 主机的项目目录 compose_dir；需要按环境生成的文件通过 compose_templates
# 清单逐项 {src, dst} 渲染，src 为控制机上的模板路径，dst 相对项目目录，
# 命中 dst 的源文件在推送时跳过。多个 compose 通过多次调用本角色、每次传入
# 不同变量（compose_src 等）区分。

- name: 校验主输入并推导项目名
  block:
    - name: 校验 compose_src 已提供
      ansible.builtin.assert:
        that:
          - compose_src | length > 0
        fail_msg: "请为 docker-compose 角色提供 compose_src（控制机上的 compose 源目录）"

    - name: 未传 compose_name 时由项目目录基名推出项目名
      ansible.builtin.set_fact:
        compose_name: "{{ compose_dir | basename }}"
      when: compose_name | length == 0

- name: 校验 compose_state 取值
  ansible.builtin.assert:
    that:
      - compose_state in ['present', 'absent']
    fail_msg: "compose_state 仅支持 present / absent"

- name: "{{ compose_name }}：启动/更新（state=present）"
  block:
    - name: "{{ compose_name }}：检查控制机源目录"
      ansible.builtin.stat:
        path: "{{ compose_src }}"
      delegate_to: localhost
      register: compose_src_stat

    - name: "{{ compose_name }}：断言源目录存在"
      ansible.builtin.assert:
        that:
          - compose_src_stat.stat.exists
          - compose_src_stat.stat.isdir
        fail_msg: "compose 源目录不存在或不是目录：{{ compose_src }}"

    - name: "{{ compose_name }}：列出源目录内容"
      ansible.builtin.find:
        paths: "{{ compose_src }}"
        recurse: true
        hidden: true
        file_type: any
      delegate_to: localhost
      register: compose_src_list

    - name: "{{ compose_name }}：组装排除正则"
      ansible.builtin.set_fact:
        compose_exclude_re: >-
          {{ '(^|/)(' + (compose_exclude | map('regex_escape') | join('|')) + ')(/|$)' }}

    - name: "{{ compose_name }}：由模板清单导出过滤路径"
      ansible.builtin.set_fact:
        # 模板将覆盖的目标相对路径，复制时对应原文件应跳过
        compose_tpl_paths: >-
          {{ compose_templates | map(attribute='dst')
             | map('regex_replace', '^(.+)$',
                   ((compose_templates_base ~ '/') if compose_templates_base else '') ~ '\1')
             | list }}

    - name: "{{ compose_name }}：组装排除项并按过滤清单组装推送列表"
      ansible.builtin.set_fact:
        compose_push_dirs: >-
          {{ compose_src_list.files
             | selectattr('isdir')
             | rejectattr('path', 'search', compose_exclude_re) | list }}
        compose_push_files: >-
          {{ compose_src_list.files
             | rejectattr('isdir')
             | rejectattr('path', 'search', compose_exclude_re)
             | map(attribute='path')
             | map('replace', compose_src + '/', '')
             | reject('in', compose_tpl_paths) | list }}

    - name: "{{ compose_name }}：检查项目目录是否已存在"
      ansible.builtin.stat:
        path: "{{ compose_dir }}"
      register: compose_dir_stat

    - name: "{{ compose_name }}：创建项目目录"
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: directory
        mode: "{{ compose_dir_mode }}"

    - name: "{{ compose_name }}：创建源目录中的目录结构"
      ansible.builtin.file:
        path: "{{ compose_dir }}/{{ item.path | replace(compose_src + '/', '') }}"
        state: directory
        mode: "{{ item.mode }}"
      loop: "{{ compose_push_dirs }}"
      when: compose_push_dirs | length > 0

    - name: "{{ compose_name }}：创建模板目标所需目录"
      ansible.builtin.file:
        path: "{{ compose_dir }}/{{ ((compose_templates_base ~ '/') if compose_templates_base else '') ~ (item.dst | dirname) }}"
        state: directory
        mode: "{{ compose_dir_mode }}"
      loop: "{{ compose_templates }}"
      when: compose_templates | length > 0

    - name: "{{ compose_name }}：推送原始项目文件"
      ansible.builtin.copy:
        src: "{{ compose_src }}/{{ item }}"
        dest: "{{ compose_dir }}/{{ item }}"
        # 保留源文件权限
        mode: "preserve"
      loop: "{{ compose_push_files }}"
      when: compose_push_files | length > 0
      register: compose_copy_result

    - name: "{{ compose_name }}：循环模板清单渲染（src -> dst）"
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ compose_dir }}/{{ ((compose_templates_base ~ '/') if compose_templates_base else '') ~ item.dst }}"
        mode: "{{ compose_file_mode }}"
      loop: "{{ compose_templates }}"
      when: compose_templates | length > 0
      register: compose_render_result

    - name: "{{ compose_name }}：校验 compose 配置"
      ansible.builtin.shell:
        cmd: "docker compose {{ compose_cli }} config -q"
        chdir: "{{ compose_dir }}"
      register: compose_config_result
      changed_when: false
      when: compose_validate | bool

    - name: "{{ compose_name }}：拉取最新镜像"
      ansible.builtin.shell:
        cmd: "docker compose {{ compose_cli }} pull --ignore-pull-failures"
        chdir: "{{ compose_dir }}"
      register: compose_pull_result
      changed_when: false
      when: compose_pull | bool

    - name: "{{ compose_name }}：启动/更新容器"
      ansible.builtin.shell:
        cmd: "docker compose {{ compose_cli }} up -d {{ compose_up_args }}"
        chdir: "{{ compose_dir }}"
      register: compose_up_result
      changed_when: >-
        compose_up_result.stdout is search('(Started|Created|Recreated|Updated)')

    - name: "{{ compose_name }}：配置文件有更新，重启容器使其生效"
      ansible.builtin.shell:
        cmd: "docker compose {{ compose_cli }} restart"
        chdir: "{{ compose_dir }}"
      when: >-
        compose_restart_on_changed | bool
        and compose_dir_stat.stat.exists
        and (compose_copy_result.changed or compose_render_result.changed)
  when: compose_state == 'present'

- name: "{{ compose_name }}：停止并移除（state=absent）"
  block:
    - name: "{{ compose_name }}：检查项目目录是否存在"
      ansible.builtin.stat:
        path: "{{ compose_dir }}"
      register: compose_dir_stat

    - name: "{{ compose_name }}：执行 docker compose down"
      ansible.builtin.shell:
        cmd: "docker compose {{ compose_cli }} down {{ compose_down_args }}"
        chdir: "{{ compose_dir }}"
      register: compose_down_result
      changed_when: compose_down_result.stdout is search('(Stopped|Removed)')
      when: compose_dir_stat.stat.exists

    - name: "{{ compose_name }}：删除项目目录"
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: absent
      when: compose_cleanup_dir | bool and compose_dir_stat.stat.exists
  when: compose_state == 'absent'
