---
# deploy_compose —— 部署单个 Docker Compose 项目。
#
# 必填变量（由 compose_config 或调用变量提供，缺失时按未定义处理）：
#   compose_src        源 compose：控制机上的目录，或压缩包 URL（含 :// 即按 URL 处理）
#   compose_dir        目标主机上的 compose 项目目录
#
# 可选：用一个字典集中传入配置。键为下方扁平变量去掉 compose_ 前缀后的名称，
# 例如 src、dir、profiles、skip_up；调用时直接传扁平变量的优先级更高，
# 因此现有调用方式保持兼容。
compose_config: {}

compose_src: "{{ compose_config.src }}"
compose_dir: "{{ compose_config.dir }}"

# 源目录内容原样推送；copy 方式不做过滤，要排除就用 sync 方式（见 compose_sync_exclude）。
#
# 压缩包 URL 模式：在控制机下载、解包到 compose_tmp_dir 下以 URL 的 sha1 命名的目录，
# 同一 URL 第二次运行不再下载；解包结果经 compose_archive_subdir 定位项目根。
#
# 形态：profile 是项目内服务组标注，可选、不强制。项目把选中的服务组写进 .env.j2
# 渲染成 .env 里的 COMPOSE_PROFILES；role 不传 --profile，只保证该行存在。
#
# 容器：由 community.docker 模块驱动。

# 本机选中的服务组集合：填项目 compose 里 services[*].profiles 的组名（不是服务名）。
# 空列表 = 不写 .env，完全以项目 .env.j2 的值为准。
compose_profiles: "{{ compose_config.profiles | default([]) }}"

# 启动前是否强制构建。默认不额外干预 Compose 自己的构建判断；
# true 时等价于 docker compose up --build，仅正常部署流程生效。
compose_force_build: "{{ compose_config.force_build | default(false) }}"

# 是否跳过启动/重启阶段。true 时只推送并生成项目文件，不进入 up.yml。
# compose_force_build 是 up 调用的参数，因此跳过 up 时也不会构建。
compose_skip_up: "{{ compose_config.skip_up | default(false) }}"

# 推送方式：copy（Ansible 逐文件）| sync（rsync，一次进程）
compose_push_method: "{{ compose_config.push_method | default('copy') }}"

# sync 推送时排除的 rsync 模式，任意层级匹配
compose_sync_exclude: "{{ compose_config.sync_exclude | default(['*.j2']) }}"

# 需要初始化的容器挂载目录，逐项 {path, owner?, group?, mode?, profile?}：
#   - path：目录，相对 compose_dir
#   - owner / group：数字 uid / gid（目标机没有容器内的用户）
#   - profile：该目录属于哪个服务组；写 all（或省略不写）即全局项，任何主机都建
compose_mount_dirs: "{{ compose_config.mount_dirs | default([]) }}"

# 需要按环境渲染的模板清单，逐项 {src, dst, profile?}：
#   - src：控制机上的模板路径（写什么用什么，建议绝对路径）
#   - dst：渲染结果落到项目目录内的相对路径
#   - profile：该模板属于哪个服务组；写 all（或省略不写）即全局项，任何主机都渲染
#   - mode：可选的落盘权限；省略时用 0644
compose_templates: "{{ compose_config.templates | default([]) }}"

# 需要按 XPath 修改的 XML 配置，逐项 {path, xpath, attribute?, value?, state?, create_if_missing?}：
#   - path：XML 文件，相对 compose_dir
#   - xpath：目标元素或属性
#   - attribute：修改属性时填写；省略则修改元素文本
#   - value：目标值
#   - state：present（默认）或 absent
#   - create_if_missing：XPath 不匹配时是否创建节点，默认 false
# 目标文件不存在时跳过该项。
compose_xml_patches: "{{ compose_config.xml_patches | default([]) }}"

# 模板可能要遍历的额外数据，给个空字典兜底：主机没提供时退化成空循环，
# 而不是让 {% for k, v in compose_extra_properties.items() %} 报未定义
compose_extra_properties: "{{ compose_config.extra_properties | default({}) }}"
# 额外环境变量：写进项目 .env 的覆盖项，键名 = compose 里引用的变量名
compose_extra_env_vars: "{{ compose_config.extra_env_vars | default({}) }}"

# ==== 压缩包 URL 模式 ====
# 控制机上的临时父目录：下载与解包落在 <该目录>/<URL 的 sha1>/ 下，不做清理
compose_tmp_dir: "{{ compose_config.tmp_dir | default('/tmp') }}"
# 包内项目根目录（相对解包根）；留空表示解包根即项目根
compose_archive_subdir: "{{ compose_config.archive_subdir | default('') }}"
# 传给 get_url 的校验值（如 sha256:...）；留空只按归档是否存在判断
compose_checksum: "{{ compose_config.checksum | default('') }}"

# present（默认，启动/更新）| absent（停止并移除）
compose_state: "{{ compose_config.state | default('present') }}"
# state=absent 时是否清理数据：移除 compose 卷（named 与 anonymous）并删除项目目录。
# 指向项目目录内的 bind mount（如 ./data）会随目录一起删掉，默认 false 不动数据。
compose_cleanup_data: "{{ compose_config.cleanup_data | default(false) }}"
