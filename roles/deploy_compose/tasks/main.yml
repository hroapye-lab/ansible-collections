---
# 部署单个 Docker Compose 项目（目录形式 + profile 服务组）。
#
# - 素材：源 compose 以路径传入（compose_src），整目录推送到 compose_dir；compose_src
#   含 :// 时按压缩包 URL 处理。role 不做 git，也不做内容过滤：sync 推送的排除项由 compose_sync_exclude 决定。

- name: 启动/更新（state=present）
  when: compose_state == 'present'
  block:
    - name: 解析源路径
      ansible.builtin.set_fact:
        # 压缩包 URL 模式的工作目录：以 URL 的 sha1 命名，同一 URL 复用、不重复下载
        compose_tmp_workdir: "{{ compose_tmp_dir }}/{{ compose_src | hash('sha1') }}"
        # 源目录：URL 模式取解包目录（可再进一层 compose_archive_subdir），否则用传入路径
        compose_src_local: >-
          {{ (compose_tmp_dir ~ '/' ~ (compose_src | hash('sha1')) ~ '/tree'
              ~ ('/' ~ compose_archive_subdir if compose_archive_subdir else ''))
             if '://' in compose_src else compose_src }}

    - name: 创建解包目录（压缩包 URL 模式）
      # get_url 不会自建父目录，这里一次把工作目录与解包目录建出来
      ansible.builtin.file:
        path: "{{ compose_tmp_workdir }}/tree"
        state: directory
      delegate_to: localhost
      when: "'://' in compose_src"

    - name: 下载压缩包（压缩包 URL 模式）
      # 归档已存在则不重下
      ansible.builtin.get_url:
        url: "{{ compose_src }}"
        dest: "{{ compose_tmp_workdir }}/archive"
        checksum: "{{ compose_checksum }}"
      delegate_to: localhost
      when: "'://' in compose_src"

    - name: 解包（压缩包 URL 模式）
      ansible.builtin.unarchive:
        src: "{{ compose_tmp_workdir }}/archive"
        dest: "{{ compose_tmp_workdir }}/tree"
        remote_src: true
      delegate_to: localhost
      when: "'://' in compose_src"

    - name: 推送项目目录（copy）
      ansible.builtin.copy:
        src: "{{ compose_src_local }}/"
        dest: "{{ compose_dir }}/"
        mode: preserve
      when: compose_push_method == 'copy'
      register: compose_push_copy

    - name: 推送项目目录（sync）
      ansible.posix.synchronize:
        src: "{{ compose_src_local }}/"
        dest: "{{ compose_dir }}/"
        # 让 rsync 继承 ansible 的 ssh 配置，如果异常检查 ssh 配置的兼容问题
        use_ssh_args: true
        rsync_opts: "{{ compose_sync_exclude | map('regex_replace', '^', '--exclude=') | list }}"
      when: compose_push_method == 'sync'
      register: compose_push_sync

    - name: 渲染模板（按 profile 筛选）
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ compose_dir }}/{{ item.dst }}"
        mode: "{{ item.mode | default('0644') }}"
      loop: "{{ compose_templates }}"
      when: item.profile | default('all') == 'all' or item.profile in compose_profiles
      register: compose_render_result

    - name: 写入 COMPOSE_PROFILES
      # 缺这行时 docker compose up 会静默跳过带 profile 的服务
      ansible.builtin.lineinfile:
        path: "{{ compose_dir }}/.env"
        regexp: '^COMPOSE_PROFILES='
        line: "COMPOSE_PROFILES={{ compose_profiles | join(',') }}"
        create: true
        mode: "0644"
      when: compose_profiles | length > 0

    - name: 启动/更新容器
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        remove_orphans: true
      register: compose_up_result

    - name: 配置文件有更新，重启容器使其生效
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: restarted
      when: not compose_up_result.changed and (compose_push_copy.changed or compose_push_sync.changed or compose_render_result.changed)

- name: 停止并移除（state=absent）
  when: compose_state == 'absent'
  block:
    - name: 检查项目目录是否存在
      ansible.builtin.stat:
        path: "{{ compose_dir }}"
      register: compose_dir_stat

    - name: 停止并移除容器
      community.docker.docker_compose_v2:
        project_src: "{{ compose_dir }}"
        state: absent
        remove_volumes: "{{ compose_cleanup_data | bool }}"
      when: compose_dir_stat.stat.exists

    - name: 删除项目目录
      ansible.builtin.file:
        path: "{{ compose_dir }}"
        state: absent
      when: compose_cleanup_data | bool and compose_dir_stat.stat.exists
