---
- name: 移除旧的 docker.sources（统一使用 one-line apt 源）
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.sources
    state: absent

- name: 创建 APT keyrings 目录
  ansible.builtin.file:
    path: "{{ docker_apt_keyring_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: 下载 Docker CE GPG 公钥
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: "{{ docker_apt_keyring_path }}"
    owner: root
    group: root
    mode: "0644"
  register: docker_apt_key

- name: 添加 Docker CE 源（one-line 格式）
  ansible.builtin.copy:
    content: >-
      deb [signed-by={{ docker_apt_keyring_path }}]
      {{ docker_apt_repo_base }}
      {{ docker_apt_repo_suites | join(' ') }}
      {{ docker_apt_repo_components | join(' ') }}
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"
  register: docker_repo

- name: 更新 apt 缓存（仅在 Docker 源或公钥变更后）
  # Docker 不要求周期性刷新索引：只有仓库或公钥变更才需要重建 apt 索引。
  # 纯缓存刷新，不计入系统变更。
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed or docker_apt_key.changed
  changed_when: false

- name: 安装 Docker 组件
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: 启动并启用 Docker 服务
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: 将用户加入 docker 组
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  when: docker_users | length > 0

- name: 写入 Docker daemon 配置（如 registry-mirrors、日志等）
  ansible.builtin.copy:
    content: "{{ docker_daemon_options | to_nice_json }}"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: restart docker
  when: docker_daemon_options | length > 0
