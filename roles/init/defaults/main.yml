close_password: "yes"
# 是否替换 Debian 的 /etc/apt/sources.list 并全量升级；"no" 表示保持系统现有源
source_list_replace: "no"
# ssh_auth_pub: "ssh-rsa  cheersmind@kpy-fz2-b"

# hostname_format 取值：
#   inventory_hostname  —— 主机名 = inventory 名
#   group-ip-inventory  —— 主机名 = 组名-内网IP-名（需 node_ip）
#   node_ip             —— 主机名 = ip-内网IP（需 node_ip）
#hostname_format: 'group-ip-inventory'

# 系统时区，留空则跳过设置
timezone: 'Asia/Shanghai'

extra_disk_device: ''
extra_mount_point: '/opt'

addon_mount_dirs:
  - { path: "/var/log", src: "/opt/log"}
  - { path: "/var/lib/rancher", src: "/opt/data/rancher"}
  - { path: "/var/lib/kubelet", src: "/opt/data/kubelet"}

iptables_extra_rules:
  - '-A INPUT -p tcp -m state --state NEW -m tcp --dport 80 -j ACCEPT'
  - '-A INPUT -p tcp -m state --state NEW -m tcp --dport 443 -j ACCEPT'
