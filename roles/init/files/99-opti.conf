fs.file-max = 1048576

kernel.panic_on_oops = 1
kernel.panic = 5
kernel.sysrq = 0
kernel.core_uses_pid = 1
kernel.msgmnb = 65536
kernel.msgmax = 65536
kernel.shmall = 4294967296
kernel.shmmax = 68719476736
net.core.somaxconn = 32768
net.core.rmem_default = 262144
net.core.wmem_default = 262144
net.core.rmem_max = 67108864
net.core.wmem_max = 67108864
net.core.netdev_max_backlog = 30000
net.ipv4.ip_forward = 1
net.ipv4.ip_local_port_range = 1024  65000
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.default.accept_source_route = 0
net.ipv4.tcp_rmem = 4096 87380 67108864
net.ipv4.tcp_wmem = 4096 65535 67108864
net.ipv4.tcp_mem = 8388608 8388608 8388608
net.ipv4.route.flush = 1
net.ipv4.tcp_no_metrics_save = 1
net.ipv4.tcp_moderate_rcvbuf = 1
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_syn_retries = 2
net.ipv4.tcp_max_orphans = 262144
net.ipv4.tcp_max_syn_backlog = 262144
net.ipv4.tcp_window_scaling = 0
net.ipv4.tcp_sack = 0
net.ipv4.tcp_fack = 1
net.ipv4.tcp_timestamps = 1
net.ipv4.tcp_fin_timeout = 5
net.ipv4.tcp_keepalive_time = 1200
net.ipv4.tcp_retrans_collapse = 0
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_max_tw_buckets = 5000
net.ipv4.icmp_echo_ignore_broadcasts = 1
#net.ipv4.icmp_echo_ignore_all = 1
# 以下参数在 Debian bookworm (kernel 6.x) 上已失效或依赖未加载的模块，
# 保留会导致 sysctl reload 报错，故移除：
#   net.ipv4.tcp_tw_recycle                 (Linux 5.9 起已从内核移除)
#   net.netfilter.nf_conntrack_*            (依赖 nf_conntrack 模块)
#   net.bridge.bridge-nf-call-*             (依赖 br_netfilter 模块)
#   fs.may_detach_mounts
# --- SIP/VoIP（Kamailio + rtpengine，主走 UDP）：提升 UDP 缓冲，降低高并发丢包 ---
net.core.rmem_default = 8388608
net.core.wmem_default = 8388608
net.ipv4.udp_rmem_min = 8192
net.ipv4.udp_wmem_min = 8192
vm.swappiness = 0

vm.overcommit_memory = 1