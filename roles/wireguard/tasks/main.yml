---
- name: Skip WireGuard when no addresses are configured
  ansible.builtin.meta: end_role
  when: wireguard_addresses | default([], true) | length == 0

- name: Install WireGuard
  ansible.builtin.import_tasks: install.yml

- name: Create WireGuard configuration directory
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Render WireGuard configuration
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: "0600"
    validate: "wg-quick strip %s"
  diff: false
  register: wireguard_config

- name: Enable and apply WireGuard systemd service
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: "{{ 'restarted' if wireguard_config.changed else 'started' }}"

- name: Verify WireGuard interface exists
  ansible.builtin.stat:
    path: "/sys/class/net/{{ wireguard_interface }}"
  register: wireguard_interface_stat

- name: Require active WireGuard interface
  ansible.builtin.assert:
    that:
      - wireguard_interface_stat.stat.exists
    fail_msg: "WireGuard service started, but interface {{ wireguard_interface }} does not exist."
